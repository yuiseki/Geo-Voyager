[project]
name = "geo-voyager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.6"]

[project.optional-dependencies]
# rasterio and numpy are the worker image's, for the population grid primitive's tests.
dev = ["pytest>=8", "rasterio==1.5.1", "numpy==2.5.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# affine, which rasterio calls, warns about its own operator.
filterwarnings = ["ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning"]
